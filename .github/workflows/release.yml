name: Release

# release-please keeps a "chore(main): release X.Y.Z" PR up to date from the Conventional Commits on main
# (manifest.json version + CHANGELOG.md). Merging it creates the vX.Y.Z tag and the GitHub release HACS installs.
# Only GITHUB_TOKEN is used (repo setting: Actions › "Allow GitHub Actions to create and approve pull requests").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zip:
    # Convenience asset for manual installs (HACS downloads the tagged tree itself).
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Zip the integration
        run: cd custom_components/wallbox_web && zip -r ../../wallbox_web.zip . -x "__pycache__/*"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" wallbox_web.zip --clobber
